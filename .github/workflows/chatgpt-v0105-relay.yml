name: ChatGPT BK Health v0.10.5 relay

on:
  push:
    branches: [main]
    paths:
      - .chatgpt-v0105-relay-trigger

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record relay run id immediately
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > .chatgpt-v0105-relay-run-id.txt
          git config user.name 'BK Health Relay'
          git config user.email 'actions@users.noreply.github.com'
          git add .chatgpt-v0105-relay-run-id.txt
          git commit -m 'Record BK Health v0.10.5 relay run id'
          git push

      - name: Download verified run550 APKs via short-lived signed URLs
        shell: bash
        run: |
          set -euo pipefail
          PHONE_URL=$(sed -n 's/^phone_url=//p' .chatgpt-v0105-relay-trigger)
          WATCH_URL=$(sed -n 's/^watch_url=//p' .chatgpt-v0105-relay-trigger)
          test -n "$PHONE_URL"
          test -n "$WATCH_URL"
          PHONE='BKHealthCoach-phone-v0.10.5-3d103e9-run550-stable.apk'
          WATCH='BKHealthCoach-watch-v0.10.5-3d103e9-run550-stable.apk'
          curl -L --fail --retry 3 --retry-all-errors "$PHONE_URL" -o "$PHONE"
          curl -L --fail --retry 3 --retry-all-errors "$WATCH_URL" -o "$WATCH"
          PHONE_SHA=$(sha256sum "$PHONE" | awk '{print $1}')
          WATCH_SHA=$(sha256sum "$WATCH" | awk '{print $1}')
          echo "Phone SHA-256: $PHONE_SHA"
          echo "Watch SHA-256: $WATCH_SHA"
          test "$PHONE_SHA" = '2a955223a0d3b225764383ec8680f8dde825dbab470c34832425f7eeef19ce2e'
          test "$WATCH_SHA" = 'c795abbc7161cbc48357b3ef36dcf869b703cbf04a6794c72bba276ab8ea4c90'

      - name: Upload both APKs as one relay artifact
        id: relay_upload
        uses: actions/upload-artifact@v4
        with:
          name: BKHealthCoach-v0.10.5-run550-stable-apks
          path: |
            BKHealthCoach-phone-v0.10.5-3d103e9-run550-stable.apk
            BKHealthCoach-watch-v0.10.5-3d103e9-run550-stable.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record relay info
        shell: bash
        run: |
          set -euo pipefail
          cat > .chatgpt-v0105-relay-info.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          artifact_id=${{ steps.relay_upload.outputs.artifact-id }}
          artifact_name=BKHealthCoach-v0.10.5-run550-stable-apks
          phone_name=BKHealthCoach-phone-v0.10.5-3d103e9-run550-stable.apk
          watch_name=BKHealthCoach-watch-v0.10.5-3d103e9-run550-stable.apk
          phone_sha256=2a955223a0d3b225764383ec8680f8dde825dbab470c34832425f7eeef19ce2e
          watch_sha256=c795abbc7161cbc48357b3ef36dcf869b703cbf04a6794c72bba276ab8ea4c90
          EOF
          git pull --rebase
          git add .chatgpt-v0105-relay-info.txt
          git commit -m 'Record BK Health v0.10.5 relay info'
          git push
