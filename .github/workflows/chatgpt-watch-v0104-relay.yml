name: ChatGPT Watch v0.10.4 relay

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  relay:
    if: contains(github.event.head_commit.message, 'Relay Watch v0104 APK')
    runs-on: ubuntu-latest
    steps:
      - name: Download stable Watch APK
        env:
          APK_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1325279518/80c0455d-cd1f-45f9-b93d-f295154dc2b8?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-20T18%3A29%3A24Z&rscd=attachment%3B+filename%3DBKHealthCoach-watch-v0.10.4-8436b59-run541-stable.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-20T17%3A29%3A03Z&ske=2026-08-20T18%3A29%3A24Z&sks=b&skv=2018-11-09&sig=njfq1ow2MtHnYAgcqXcV%2BxK9ZVLWJNW7CqBwRUrsmJ4%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NzI0ODMxNywibmJmIjoxNzg3MjQ4MDE3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.pf7bKjVrMEdasxaxPlnC7349ugxIzdZ4clQj2QhFhQM&response-content-disposition=attachment%3B%20filename%3DBKHealthCoach-watch-v0.10.4-8436b59-run541-stable.apk&response-content-type=application%2Fvnd.android.package-archive"
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$APK_URL" -o BKHealthCoach-watch-v0.10.4-8436b59-run541-stable.apk
          test -s BKHealthCoach-watch-v0.10.4-8436b59-run541-stable.apk
          sha256sum BKHealthCoach-watch-v0.10.4-8436b59-run541-stable.apk > APK.sha256
      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: BKHealthCoach-watch-v0.10.4-8436b59-run541-stable
          path: |
            BKHealthCoach-watch-v0.10.4-8436b59-run541-stable.apk
            APK.sha256
          retention-days: 1
      - name: Mark relay ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='Watch v0104 relay artifact' \
            -f description='Watch v0.10.4 APK artifact ready' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
